# Tagged releases: WASM binary, web.zip, libmicron natives, language packages, SHASUMS256.txt.
#
# Bump action versions by changing the tag in `uses:` and the SHA in the comment
# block below (verify with):
#   curl -sL https://api.github.com/repos/<org>/<repo>/git/refs/tags/<tag> | jq -r '.object.sha'
# For annotated third-party tags, resolve the commit:
#   curl -sL https://api.github.com/repos/<org>/<repo>/git/tags/<tag_sha> | jq -r '.object.sha'
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/setup-go@v6.1.0            4dc6199c7b1a012772edbd06daecab0f50c9053c
#   actions/setup-node@v6.1.0        395ad3262231945c25e8478fd5baf05154b1d79f
#   actions/setup-python@v6.0.0      e797f83bcb11b83ae66e0230d6156d7c80228e7c
#   actions/setup-dotnet@v5.0.0      d4c94342e560b34958eacfc5d055d21461ed1c5d
#   actions/setup-java@v5.0.0        dded0888837ed1f317902acf8a20df0ad188d165
#   actions/upload-artifact@v4.6.2   ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4.3.0 d3f86a106a0bac45b974a628896c90dbdf5c8093
#
# Pinned third-party actions:
#   softprops/action-gh-release@v2.6.2 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
#   step-security/harden-runner@v2.21.1 e14015d583714f6e62063499dc959a02595150a1

name: Release

on:
    push:
        tags:
            - "**"

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: "1.26.5"

jobs:
    verify:
        name: Test before release
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                egress-policy: audit
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Set up Node
              uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
              with:
                  node-version: "22"

            - name: Verify
              run: |
                  set -euo pipefail
                  make check-vendor-js
                  go test -count=1 ./...
                  go test -count=1 ./micron -run 'TestInteropWithReferenceJS|TestRegressionCorpus'
                  make test-wasm

    natives:
        name: libmicron ${{ matrix.platform }}
        needs: verify
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-amd64
                      runner: ubuntu-latest
                      lib: libmicron.so
                    - platform: linux-arm64
                      runner: ubuntu-24.04-arm
                      lib: libmicron.so
                    - platform: darwin-amd64
                      runner: macos-13
                      lib: libmicron.dylib
                    - platform: darwin-arm64
                      runner: macos-14
                      lib: libmicron.dylib
                    - platform: windows-amd64
                      runner: windows-latest
                      lib: libmicron.dll
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                egress-policy: audit

            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Set up Python
              uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
              with:
                  python-version: "3.12"

            - name: Set up Node
              uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
              with:
                  node-version: "22"

            - name: Set up .NET
              uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
              with:
                  dotnet-version: "8.0.x"

            - name: Set up Java
              uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Build libmicron
              shell: bash
              run: |
                  set -euo pipefail
                  make lib
                  EXT="${{ matrix.lib }}"
                  EXT="${EXT##*.}"
                  cp "dist/${{ matrix.lib }}" "dist/libmicron-${{ matrix.platform }}.${EXT}"

            - name: Package language bindings
              shell: bash
              run: |
                  set -euo pipefail
                  chmod +x scripts/package-bindings.sh scripts/build-java-jar.sh
                  ./scripts/package-bindings.sh "${{ matrix.platform }}" "dist/${{ matrix.lib }}"

            - name: Upload platform artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: natives-${{ matrix.platform }}
                  path: |
                      dist/libmicron-${{ matrix.platform }}.*
                      dist/micron.h
                      dist/packages/*
                  if-no-files-found: error

    release:
        name: Build and publish
        needs: [verify, natives]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                egress-policy: audit
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Build WASM and web bundle
              run: |
                  set -euo pipefail
                  make wasm
                  cp web/micron.wasm micron-parser-go.wasm
                  python3 - <<'PY'
                  import zipfile
                  from pathlib import Path

                  web = Path("web")
                  with zipfile.ZipFile(
                      "web.zip", "w", compression=zipfile.ZIP_DEFLATED
                  ) as zf:
                      for path in sorted(web.rglob("*")):
                          if path.is_file():
                              zf.write(path, path.as_posix())
                  PY

            - name: Download native artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: natives-*
                  path: release-natives
                  merge-multiple: true

            - name: Collect release files
              run: |
                  set -euo pipefail
                  mkdir -p release-out
                  cp micron-parser-go.wasm web.zip release-out/
                  find release-natives -type f \( \
                    -name 'libmicron-*' -o -name 'micron.h' -o -name '*.whl' \
                    -o -name '*.tar.gz' -o -name '*.jar' -o -name '*.nupkg' -o -name '*.gem' \
                  \) -exec cp -t release-out {} +
                  test -f release-out/micron.h || cp bindings/c/micron.h release-out/micron.h
                  (
                    cd release-out
                    sha256sum * > SHASUMS256.txt
                  )
                  ls -la release-out

            - name: Create GitHub release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
              with:
                  files: release-out/*
                  fail_on_unmatched_files: true
                  generate_release_notes: true
